name: Build & Publish Native Desktop Executables

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Set package version
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: npm pkg set version="${TAG_NAME#v}"

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.merchantgo.store

      - name: Install Debian packaging dependency
        run: sudo apt-get update && sudo apt-get install -y libcrypt1

      - name: Package Debian installer
        run: npx electron-builder --linux deb --publish never

      - name: Upload Debian installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: MerchantGo ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.yml

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Set package version
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $version = $env:TAG_NAME -replace '^v',''
          npm pkg set version=$version

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.merchantgo.store

      - name: Package NSIS installer
        run: npx electron-builder --win nsis --publish never

      - name: Upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: MerchantGo ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.yml
