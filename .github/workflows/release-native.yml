name: Build & Publish Native Desktop Executables

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-desktop:
    name: 💻 Compile Windows & Linux Executables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install & Build
        run: |
          npm ci --legacy-peer-deps
          npm pkg set version="${GITHUB_REF_NAME#v}"
          npm run build
        env:
          VITE_API_BASE_URL: https://api.merchantgo.store
          
      - name: Compile Electron Executables
        run: npx electron-builder --linux --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.AppImage
